- type: grid
  column_span: 2
  cards:
  - type: markdown
    content: '**Raumfarbe** &nbsp; <font color=''#e63214''>■</font> heizt stark (≥ 66 % der letzten Stunde) &nbsp; <font color=''#ff821e''>■</font>
      mittel &nbsp; <font color=''#ffbe46''>■</font> leicht &nbsp; <font color=''#468ce6''>■</font> Ziel erreicht &nbsp; <font
      color=''#969696''>■</font> aus / offline


      Raum antippen öffnet den Thermostat.'
    grid_options:
      columns: full
  - type: heading
    heading: Thermostate
    heading_style: subtitle
    icon: mdi:radiator
    entities:
    - entity: script.heizung_alle_aus
      state_content: name
      color: blue-grey
      tap_action:
        action: perform-action
        perform_action: script.heizung_alle_aus
        confirmation:
          text: Alle Thermostate ausschalten?
    - entity: script.heizung_alle_16
      state_content: name
      color: deep-orange
      tap_action:
        action: perform-action
        perform_action: script.heizung_alle_16
        confirmation:
          text: Alle Thermostate auf Heizen mit 16 °C stellen?
