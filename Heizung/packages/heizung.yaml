sensor:
  - platform: history_stats
    name: Heizung WZ Heizanteil
    unique_id: heizung_wz_heizanteil
    entity_id: binary_sensor.heizung_wz_heizt
    state: "on"
    type: ratio
    end: "{{ now() }}"
    duration:
      hours: 1
  - platform: history_stats
    name: Heizung EZ Heizanteil
    unique_id: heizung_ez_heizanteil
    entity_id: binary_sensor.heizung_ez_heizt
