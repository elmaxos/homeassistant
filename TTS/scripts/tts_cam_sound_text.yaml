tts_cam_sound_text:
  alias: tts_cam_sound_text
  description: Signalton und/oder Ansage auf einer oder mehreren Kameras
  fields:
    message:
      name: Nachricht
      description: Der Text, der vorgelesen werden soll. Leer lassen für nur Sound.
      required: false
      default: ''
      selector:
        text: null
    kameras:
      name: Kameras
      description: Auf welchen Kameras abgespielt werden soll
      required: false
      default:
      - wohnzimmer
      selector:
        select:
          multiple: true
          options:
          - label: Wohnzimmer (3684)
            value: wohnzimmer
          - label: SONOFF PT2 4 (4420)
            value: kamera4420
          - label: Handy Max (nur Text, Android-TTS)
            value: handy
    sound:
      selector:
        select:
          options:
          - label: Kein Sound
            value: keiner
          - label: Gong (Cam)
            value: chime
          - label: Klingel
            value: bell
          - label: Alarm
            value: alarm
          - label: Hinweis
            value: notification
          - label: Music Trap
            value: music_trap
          - label: 21st Century Fox
            value: 21st_century_fox
          - label: 12 Uhr
            value: 12uhr
      default: chime
    voice:
      selector:
        select:
          options:
          - label: Eva LOW
            value: de_DE-eva_k-x_low
          - label: Karlsson LOW
            value: de_DE-karlsson-low
          - label: Kerstin LOW
            value: de_DE-kerstin-low
          - label: mls MEDIUM
            value: de_DE-mls-medium
          - label: Pavoque LOW
            value: de_DE-pavoque-low
          - label: Ramona LOW
            value: de_DE-ramona-low
          - label: Thorsten HIGH
            value: de_DE-thorsten-high
          - label: Thorsten LOW
            value: de_DE-thorsten-low
          - label: Thorsten MEDIUM
            value: de_DE-thorsten-medium
          - label: Thorsten emotional MEDIUM
            value: de_DE-thorsten_emotional-medium
          - label: US Lessac MEDIUM
            value: en_US-lessac-medium
      default: de_DE-thorsten-low
    sound_pause:
      name: Pause nach Sound
      description: Optional. Überschreibt die Standard-Wartezeit des gewählten Sounds.
      required: false
      selector:
        number:
          min: 0
          max: 60
          step: 0.5
          unit_of_measurement: s
          mode: box
    zweimal:
      name: Zweimal abspielen
      description: Hängt den Text ein zweites Mal an
      required: false
      default: false
      selector:
        boolean: null
    warten:
      name: Auf Anwesenheit warten
      description: Wartet auf Bewegung, spätestens nach 30 Minuten wird trotzdem abgespielt
      required: false
      default: false
      selector:
        boolean: null
    licht:
      name: Licht einschalten
      description: Weißlicht der Kamera während der Ansage einschalten
      required: false
      default: true
      selector:
        boolean: null
  sequence:
  - variables:
      auswahl: '{% set k = kameras | default([''wohnzimmer'']) %}{{ [k] if k is string else k }}'
      melder:
        wohnzimmer: binary_sensor.wz_myg_sofa_belegung
      bewegungsmelder: '{% set ns = namespace(m=[]) %}{% for k in auswahl %}{% if k in melder %}{% set ns.m = ns.m + [melder[k]] %}{% endif %}{% endfor %}{{ ns.m }}'
  - if:
    - condition: template
      value_template: '{{ (warten | default(false)) and (bewegungsmelder | length > 0) }}'
    then:
    - wait_template: '{{ expand(bewegungsmelder) | selectattr(''state'', ''eq'', ''on'') | list | length > 0 }}'
      timeout:
        minutes: 30
      continue_on_timeout: true
  - action: script.tts_cam_ausgabe
    data:
      message: '{{ message | default('''') }}'
      kameras: '{{ auswahl }}'
      sound: '{{ sound | default(''chime'') }}'
      voice: '{{ voice | default(''de_DE-thorsten-low'') }}'
      sound_pause: '{{ sound_pause if sound_pause is defined and sound_pause is not none else '''' }}'
      zweimal: '{{ zweimal | default(false) }}'
      licht: '{{ licht | default(true) }}'
  mode: parallel
  max: 10
