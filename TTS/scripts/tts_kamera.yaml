tts_kamera:
  alias: TTS Kamera
  description: Liest einen Text auf einer oder mehreren Kameras vor
  fields:
    message:
      name: Nachricht
      description: Der Text, der vorgelesen werden soll
      required: true
      selector:
        text:
    kameras:
      name: Kameras
      description: Auf welchen Kameras vorgelesen werden soll
      required: false
      default:
      - wohnzimmer
      selector:
        select:
          multiple: true
          options:
          - label: Wohnzimmer (3684)
            value: wohnzimmer
          - label: SONOFF PT2 4 (4420)
            value: kamera4420
    sound:
      name: Sound
      description: Signalton vor der Ansage
      required: false
      default: chime
      selector:
        select:
          options:
          - label: Gong
            value: chime
          - label: Alarm
            value: alarm
          - label: Hinweis
            value: notification
    zweimal:
      name: Zweimal abspielen
      description: Hängt den Text ein zweites Mal an
      required: false
      default: false
      selector:
        boolean:
    warten:
      name: Auf Anwesenheit warten
      description: Wartet auf Bewegung, spätestens nach 30 Minuten wird trotzdem vorgelesen
      required: false
      default: false
      selector:
        boolean:
  sequence:
  - if:
    - condition: template
      value_template: '{{ warten | default(false) }}'
    then:
    - wait_template: '{{ is_state(''binary_sensor.wz_myg_sofa_belegung'', ''on'')
        }}'
      timeout:
        minutes: 30
      continue_on_timeout: true
  - variables:
      geraete:
        wohnzimmer:
          topic: ing-sonoff-pt2-3684/cmd
          licht: switch.ing_sonoff_pt2_3684_white_light
        kamera4420:
          topic: ing-sonoff-pt2-4420/cmd
          licht: switch.ing_sonoff_pt2_4420_white_light
      auswahl: '{% set k = kameras | default([''wohnzimmer'']) %}{{ [k] if k is string
        else k }}'
      lichter: '{% set k = kameras | default([''wohnzimmer'']) %}{% set l = [k] if
        k is string else k %}{{ l | map(''extract'', {''wohnzimmer'': ''switch.ing_sonoff_pt2_3684_white_light'',
        ''kamera4420'': ''switch.ing_sonoff_pt2_4420_white_light''}) | list }}'
      text: '{% set t = message | replace(''"'', '''') | replace(''\n'', '' '') %}{{
        t }}{% if zweimal | default(false) %} ... Ich wiederhole. {{ t }}{% endif
        %}'
  - action: switch.toggle
    target:
      entity_id: '{{ lichter }}'
  - action: rest_command.thingino_tts
    data:
      message: '{{ text }}'
    response_variable: tts_result
  - action: script.tts_cam_sound
    data:
      sound: '{{ sound | default(''chime'') }}'
      kameras: '{{ auswahl }}'
  - repeat:
      for_each: '{{ auswahl }}'
      sequence:
      - action: mqtt.publish
        data:
          topic: '{{ geraete[repeat.item].topic }}'
          payload: play 'http://192.168.0.48:8123{{ tts_result.content.path }}'
  - delay:
      seconds: '{{ (text | length / 13) | round(0) + 2 }}'
  - action: switch.toggle
    target:
      entity_id: '{{ lichter }}'
  mode: queued
  max: 5
