tts_kamera_3684_2:
  alias: tts_cam_sound
  description: Spielt einen Signalton auf einer oder mehreren Kameras ab
  fields:
    sound:
      name: Sound
      description: Welcher Ton abgespielt werden soll
      required: false
      default: chime
      selector:
        select:
          options:
          - label: Gong
            value: chime
          - label: Alarm
            value: alarm
          - label: Hinweis
            value: notification
    kameras:
      name: Kameras
      description: Auf welchen Kameras abgespielt werden soll
      required: false
      default:
      - wohnzimmer
      selector:
        select:
          multiple: true
          options:
          - label: Wohnzimmer (3684)
            value: wohnzimmer
          - label: SONOFF PT2 4 (4420)
            value: kamera4420
  sequence:
  - variables:
      geraete:
        wohnzimmer: ing-sonoff-pt2-3684/cmd
        kamera4420: ing-sonoff-pt2-4420/cmd
      sounds:
        chime: /usr/share/sounds/chime_3.opus
        alarm: '''http://192.168.0.48:8123/local/sounds/alarm_1.mp3'''
        notification: '''http://192.168.0.48:8123/local/sounds/notification_1.mp3'''
      auswahl: '{% set k = kameras | default([''wohnzimmer'']) %}{{ [k] if k is string
        else k }}'
      datei: '{{ sounds[sound | default(''chime'')] }}'
  - repeat:
      for_each: '{{ auswahl }}'
      sequence:
      - action: mqtt.publish
        data:
          topic: '{{ geraete[repeat.item] }}'
          payload: play {{ datei }}
  - delay:
      seconds: 2
  mode: queued
  max: 5
