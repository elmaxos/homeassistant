rest_command:
  # Rückwärts-Geokodierung (Koordinaten -> Adresse) über OpenStreetMap, genutzt von script.tesla_standort_adresse
  nominatim_reverse:
    url: "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat={{ lat }}&lon={{ lon }}&zoom=18&addressdetails=1&accept-language=de"
    method: GET
    headers:
      User-Agent: "HomeAssistant-elmaxos/1.0 (tesla_standort_adresse)"
    timeout: 10
  tagesschau:
    url: https://www.tagesschau.de/api2u/homepage/
    method: GET
#tagesschau


# thingino tts (74)
# thingino tts (74)
  thingino_tts:
    url: "http://192.168.0.48:8123/api/tts_get_url"
    method: POST
    headers:
      Authorization: !secret thingino_74_tts
      Content-Type: "application/json"
    payload: >
      {
        "engine_id": "tts.piper",
        "message": "{{ message }}",
        "options": {
          "voice": "{{ voice | default('de_DE-pavoque-low') }}",
          "preferred_format": "mp3"
        }
      }
