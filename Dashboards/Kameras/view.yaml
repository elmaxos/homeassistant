type: sections
title: Kameras
path: kameras-ptz
icon: mdi:cctv
max_columns: 4
sections:
- type: grid
  column_span: 4
  cards:
  - type: custom:advanced-camera-card
    cameras:
    - id: wohnzimmer
      camera_entity: camera.sonoff_pt2_1_profile_0
      dependencies:
        cameras:
        - wohnzimmer_sub
      title: Wohnzimmer
      icon: mdi:sofa
      ptz:
        r2c_delay_between_calls_seconds: 0.4
        actions_left:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.ing_sonoff_pt2_3684_ptz_left_fast
        actions_right:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.ing_sonoff_pt2_3684_ptz_right_fast
        actions_up:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.ing_sonoff_pt2_3684_ptz_up_fast
        actions_down:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.ing_sonoff_pt2_3684_ptz_down_fast
        presets:
          Preset 1:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.ing_sonoff_pt2_3684_preset_1_load
          Preset 2:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.ing_sonoff_pt2_3684_preset_2_load
          Preset 0:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.ing_sonoff_pt2_3684_preset_0_load
    - id: schlafzimmer
      camera_entity: camera.sonoff_pt2_3_profile_0
      dependencies:
        cameras:
        - schlafzimmer_sub
      title: Schlafzimmer
      icon: mdi:bed
      ptz:
        r2c_delay_between_calls_seconds: 0.4
        actions_left:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.ing_sonoff_pt2_a574_ptz_right_fast
        actions_right:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.ing_sonoff_pt2_a574_ptz_left_fast
        actions_up:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.ing_sonoff_pt2_a574_ptz_down_fast
        actions_down:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.ing_sonoff_pt2_a574_ptz_up_fast
        presets:
          Ansicht 1:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.ing_sonoff_pt2_a574_preset_1_load
          Privat:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.ing_sonoff_pt2_a574_preset_0_load
    - id: unterstand
      camera_entity: camera.sonoff_pt2_t23n_sc2336p_atbm6012bx_profile_1
      title: Unterstand
      icon: mdi:home-roof
      ptz:
        r2c_delay_between_calls_seconds: 0.4
        actions_left:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.ing_sonoff_pt2_26a4_ptz_right_fast
        actions_right:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.ing_sonoff_pt2_26a4_ptz_left_fast
        actions_up:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.ing_sonoff_pt2_26a4_ptz_down_fast
        actions_down:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.ing_sonoff_pt2_26a4_ptz_up_fast
        presets:
          Preset 1:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.ing_sonoff_pt2_26a4_preset_1_load
          Preset 0:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.ing_sonoff_pt2_26a4_preset_0_load
    - id: kamera4420
      camera_entity: camera.sonoff_pt2_t23n_sc2336p_atbm6012bx_profile_0_2
      title: Kamera 4420
      icon: mdi:cctv
      ptz:
        r2c_delay_between_calls_seconds: 0.4
        actions_left:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.ing_sonoff_pt2_4420_ptz_left_fast
        actions_right:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.ing_sonoff_pt2_4420_ptz_right_fast
        actions_up:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.ing_sonoff_pt2_4420_ptz_up_fast
        actions_down:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.ing_sonoff_pt2_4420_ptz_down_fast
        presets:
          Preset 0:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.ing_sonoff_pt2_4420_preset_0_load
          Preset 1:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.ing_sonoff_pt2_4420_preset_1_load
    - id: wohnzimmer_sub
      camera_entity: camera.sonoff_pt2_1_profile_1
      title: Wohnzimmer (klein)
      capabilities:
        disable_except:
        - substream
    - id: schlafzimmer_sub
      camera_entity: camera.sonoff_kamera_3_profile_1
      title: Schlafzimmer (klein)
      capabilities:
        disable_except:
        - substream
    view:
      default: live
    live:
      zoomable: true
      draggable: false
      preload: false
      lazy_unload:
      - hidden
      display:
        mode: single
        grid_columns: 2
        grid_selected_width_factor: 1
      controls:
        ptz:
          mode: 'off'
          position: bottom-right
          orientation: horizontal
        next_previous:
          style: chevrons
        thumbnails:
          mode: none
    menu:
      style: outside
      position: top
      alignment: right
      buttons:
        iris:
          enabled: false
        live:
          enabled: false
        clips:
          enabled: false
        snapshots:
          enabled: false
        recordings:
          enabled: false
        image:
          enabled: false
        timeline:
          enabled: false
        media_player:
          enabled: false
        expand:
          enabled: false
        microphone:
          enabled: false
        ptz_home:
          enabled: false
        download:
          enabled: false
        camera_ui:
          enabled: false
        screenshot:
          enabled: false
        play:
          enabled: false
        mute:
          enabled: false
        cameras:
          enabled: true
          priority: 90
        display_mode:
          enabled: true
          priority: 85
        substreams:
          enabled: true
          priority: 80
          icon: mdi:high-definition-box
        ptz_controls:
          enabled: true
          priority: 75
        fullscreen:
          enabled: true
          priority: 70
    status_bar:
      style: none
    elements:
    - type: custom:advanced-camera-card-menu-icon
      icon: mdi:magnify-plus-outline
      title: Zoom +
      start_tap_action:
        action: custom:advanced-camera-card-action
        advanced_camera_card_action: ptz_digital
        ptz_action: zoom_in
        ptz_phase: start
      end_tap_action:
        action: custom:advanced-camera-card-action
        advanced_camera_card_action: ptz_digital
        ptz_action: zoom_in
        ptz_phase: stop
    - type: custom:advanced-camera-card-menu-icon
      icon: mdi:magnify-minus-outline
      title: Zoom -
      start_tap_action:
        action: custom:advanced-camera-card-action
        advanced_camera_card_action: ptz_digital
        ptz_action: zoom_out
        ptz_phase: start
      end_tap_action:
        action: custom:advanced-camera-card-action
        advanced_camera_card_action: ptz_digital
        ptz_action: zoom_out
        ptz_phase: stop
    - type: custom:advanced-camera-card-menu-icon
      icon: mdi:magnify-close
      title: Zoom zuruecksetzen
      tap_action:
        action: custom:advanced-camera-card-action
        advanced_camera_card_action: ptz_digital
        absolute:
          zoom: 1
          pan:
            x: 50
            y: 50
    - type: custom:advanced-camera-card-conditional
      conditions:
      - condition: camera
        cameras:
        - wohnzimmer
      elements:
      - type: custom:advanced-camera-card-menu-state-icon
        entity: switch.ing_sonoff_pt2_3684_white_light
        icon: mdi:light-flood-down
        title: Weisslicht
        tap_action:
          action: toggle
      - type: custom:advanced-camera-card-menu-state-icon
        entity: switch.ing_sonoff_pt2_3684_ir_light_850nm
        icon: mdi:led-outline
        title: IR-Licht
        tap_action:
          action: toggle
      - type: custom:advanced-camera-card-menu-state-icon
        entity: switch.ing_sonoff_pt2_3684_privacy
        icon: mdi:eye-off
        title: Privatsphaere
        tap_action:
          action: toggle
      - type: custom:advanced-camera-card-menu-state-icon
        entity: switch.ing_sonoff_pt2_3684_ir_cut
        icon: mdi:camera-iris
        title: IR-Filter
        tap_action:
          action: toggle
      - type: custom:advanced-camera-card-menu-state-icon
        entity: switch.ing_sonoff_pt2_3684_color_mode
        icon: mdi:invert-colors
        title: Farbe / Schwarzweiss
        tap_action:
          action: toggle
      - type: custom:advanced-camera-card-menu-state-icon
        entity: switch.ing_sonoff_pt2_3684_status_led
        icon: mdi:led-on
        title: Status-LED (blau)
        tap_action:
          action: toggle
    - type: custom:advanced-camera-card-conditional
      conditions:
      - condition: camera
        cameras:
        - schlafzimmer
      elements:
      - type: custom:advanced-camera-card-menu-state-icon
        entity: switch.ing_sonoff_pt2_a574_white_light
        icon: mdi:light-flood-down
        title: Weisslicht
        tap_action:
          action: toggle
          confirmation:
            text: Weißlicht (Flutlicht) im Schlafzimmer umschalten?
      - type: custom:advanced-camera-card-menu-state-icon
        entity: switch.ing_sonoff_pt2_a574_ir_light_850nm
        icon: mdi:led-outline
        title: IR-Licht
        tap_action:
