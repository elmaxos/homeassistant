      - type: custom:advanced-camera-card-menu-state-icon
        entity: switch.ing_sonoff_pt2_26a4_status_led
        icon: mdi:led-on
        title: Status-LED (blau)
        tap_action:
          action: toggle
    - type: custom:advanced-camera-card-conditional
      conditions:
      - condition: camera
        cameras:
        - kamera4420
      elements:
      - type: custom:advanced-camera-card-menu-state-icon
        entity: switch.ing_sonoff_pt2_4420_white_light
        icon: mdi:light-flood-down
        title: Weisslicht
        tap_action:
          action: toggle
      - type: custom:advanced-camera-card-menu-state-icon
        entity: switch.ing_sonoff_pt2_4420_ir_light_850nm
        icon: mdi:led-outline
        title: IR-Licht
