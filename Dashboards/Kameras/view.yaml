      - type: custom:advanced-camera-card-menu-state-icon
        entity: switch.ing_sonoff_pt2_a574_privacy
        icon: mdi:eye-off
        title: Privatsphaere
        tap_action:
          action: toggle
      - type: custom:advanced-camera-card-menu-state-icon
        entity: switch.ing_sonoff_pt2_a574_ir_cut
        icon: mdi:camera-iris
        title: IR-Filter
        tap_action:
          action: toggle
      - type: custom:advanced-camera-card-menu-state-icon
        entity: switch.ing_sonoff_pt2_a574_color_mode
        icon: mdi:invert-colors
        title: Farbe / Schwarzweiss
        tap_action:
          action: toggle
      - type: custom:advanced-camera-card-menu-state-icon
        entity: switch.ing_sonoff_pt2_a574_noise
        icon: mdi:waveform
        title: Rauschen
        tap_action:
          action: toggle
      - type: custom:advanced-camera-card-menu-submenu-select
        entity: select.ing_sonoff_pt2_a574_noise_color
        icon: mdi:palette
        title: Rauschen Farbe
      - type: custom:advanced-camera-card-menu-submenu
        icon: mdi:volume-medium
        title: Rauschen Lautstaerke
        items:
        - title: Lautstaerke 10
          icon: mdi:volume-low
          tap_action:
            action: perform-action
            perform_action: number.set_value
            target:
              entity_id: number.ing_sonoff_pt2_a574_noise_volume
            data:
              value: 10
        - title: Lautstaerke 20
          icon: mdi:volume-low
          tap_action:
            action: perform-action
            perform_action: number.set_value
            target:
              entity_id: number.ing_sonoff_pt2_a574_noise_volume
            data:
              value: 20
        - title: Lautstaerke 30
          icon: mdi:volume-low
          tap_action:
            action: perform-action
            perform_action: number.set_value
            target:
              entity_id: number.ing_sonoff_pt2_a574_noise_volume
            data:
              value: 30
        - title: Lautstaerke 40
          icon: mdi:volume-medium
          tap_action:
            action: perform-action
            perform_action: number.set_value
            target:
              entity_id: number.ing_sonoff_pt2_a574_noise_volume
            data:
              value: 40
        - title: Lautstaerke 50
          icon: mdi:volume-medium
          tap_action:
            action: perform-action
            perform_action: number.set_value
            target:
              entity_id: number.ing_sonoff_pt2_a574_noise_volume
            data:
              value: 50
        - title: Lautstaerke 60
          icon: mdi:volume-medium
          tap_action:
            action: perform-action
            perform_action: number.set_value
            target:
              entity_id: number.ing_sonoff_pt2_a574_noise_volume
            data:
              value: 60
        - title: Lautstaerke 70
          icon: mdi:volume-high
          tap_action:
            action: perform-action
            perform_action: number.set_value
            target:
              entity_id: number.ing_sonoff_pt2_a574_noise_volume
            data:
              value: 70
        - title: Lautstaerke 80
          icon: mdi:volume-high
          tap_action:
            action: perform-action
            perform_action: number.set_value
            target:
              entity_id: number.ing_sonoff_pt2_a574_noise_volume
            data:
              value: 80
      - type: custom:advanced-camera-card-menu-state-icon
        entity: switch.ing_sonoff_pt2_a574_status_led
        icon: mdi:led-on
        title: Status-LED (blau)
        tap_action:
          action: toggle
    - type: custom:advanced-camera-card-conditional
      conditions:
      - condition: camera
        cameras:
        - unterstand
      elements:
      - type: custom:advanced-camera-card-menu-state-icon
        entity: switch.ing_sonoff_pt2_26a4_white_light
        icon: mdi:light-flood-down
        title: Weisslicht
        tap_action:
          action: toggle
      - type: custom:advanced-camera-card-menu-state-icon
        entity: switch.ing_sonoff_pt2_26a4_ir_light_850nm
