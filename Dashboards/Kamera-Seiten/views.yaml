  path: kamera-unterstand
  icon: mdi:home-roof
  subview: true
  back_path: /dashboard-testdashboard/kamera
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: button
      name: Wohnzimmer
      icon: mdi:sofa
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /dashboard-testdashboard/kamera-wohnzimmer
      grid_options:
        columns: 3
        rows: 1
    - type: button
      name: Schlafzimmer
      icon: mdi:bed
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /dashboard-testdashboard/kamera-schlafzimmer
      grid_options:
        columns: 3
        rows: 1
    - type: button
      name: ● Unterstand
      icon: mdi:home-roof
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /dashboard-testdashboard/kamera-unterstand
      grid_options:
        columns: 3
        rows: 1
    - type: button
      name: Kamera 4420
      icon: mdi:cctv
      show_state: false
      tap_action:
        action: navigate
        navigation_path: /dashboard-testdashboard/kamera-kamera4420
      grid_options:
        columns: 3
        rows: 1
  - type: grid
    cards:
    - type: heading
      heading: Unterstand
      icon: mdi:home-roof
      heading_style: title
    - type: picture-glance
      camera_image: camera.sonoff_pt2_t23n_sc2336p_atbm6012bx_profile_1
      camera_view: live
      fit_mode: cover
      entities: []
      title: Unterstand
      grid_options:
        columns: full
    - type: button
      icon: mdi:arrow-left-bold
      show_name: false
      show_icon: true
      grid_options:
        columns: 3
        rows: 1
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.ing_sonoff_pt2_26a4_ptz_right_fast
    - type: button
      icon: mdi:arrow-up-bold
      show_name: false
      show_icon: true
      grid_options:
        columns: 3
        rows: 1
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.ing_sonoff_pt2_26a4_ptz_down_fast
    - type: button
      icon: mdi:arrow-down-bold
      show_name: false
      show_icon: true
      grid_options:
        columns: 3
        rows: 1
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.ing_sonoff_pt2_26a4_ptz_up_fast
    - type: button
      icon: mdi:arrow-right-bold
      show_name: false
      show_icon: true
      grid_options:
        columns: 3
        rows: 1
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.ing_sonoff_pt2_26a4_ptz_left_fast
  - type: grid
    cards:
    - type: heading
      heading: Position
      heading_style: subtitle
      icon: mdi:camera-marker-outline
      entities: []
    - type: button
      icon: mdi:numeric-1-box
      show_name: true
      show_icon: true
      grid_options:
        columns: 3
        rows: 1
      name: Preset 1
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.ing_sonoff_pt2_26a4_preset_1_load
    - type: button
      icon: mdi:numeric-0-box
      show_name: true
      show_icon: true
      grid_options:
        columns: 3
        rows: 1
      name: Preset 0
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.ing_sonoff_pt2_26a4_preset_0_load
    - type: button
      icon: mdi:image-filter-center-focus
      show_name: true
      show_icon: true
      grid_options:
        columns: 3
        rows: 1
      name: Mitte
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.ing_sonoff_pt2_26a4_position_reset
    - type: heading
      heading: Licht & Bild
      heading_style: subtitle
      icon: mdi:lightbulb-on-outline
    - type: tile
      entity: switch.ing_sonoff_pt2_26a4_white_light
      name: Weißlicht
      vertical: false
      grid_options:
        columns: 6
      tap_action:
        action: toggle
      icon_tap_action:
        action: toggle
      icon: mdi:light-flood-down
    - type: tile
      entity: switch.ing_sonoff_pt2_26a4_ir_light_850nm
      name: IR-Licht
      vertical: false
      grid_options:
        columns: 6
      tap_action:
        action: toggle
      icon_tap_action:
        action: toggle
      icon: mdi:led-outline
    - type: tile
      entity: switch.ing_sonoff_pt2_26a4_ir_cut
      name: IR-Filter
      vertical: false
      grid_options:
        columns: 6
      tap_action:
        action: toggle
      icon_tap_action:
        action: toggle
      icon: mdi:camera-iris
    - type: tile
      entity: switch.ing_sonoff_pt2_26a4_color_mode
      name: Farbe (aus = Schwarzweiß)
      vertical: false
      grid_options:
        columns: 6
      tap_action:
        action: toggle
      icon_tap_action:
        action: toggle
      icon: mdi:invert-colors
    - type: tile
      entity: switch.ing_sonoff_pt2_26a4_status_led
      name: Status-LED (blau)
      vertical: false
      grid_options:
        columns: 6
      tap_action:
        action: toggle
      icon_tap_action:
        action: toggle
      icon: mdi:led-on
    - type: tile
      entity: switch.ing_sonoff_pt2_26a4_privacy
      name: Privatsphäre
      vertical: false
      grid_options:
        columns: 6
      tap_action:
        action: toggle
      icon_tap_action:
        action: toggle
      icon: mdi:eye-off
  - type: grid
    cards:
    - type: heading
      heading: Ansage
      heading_style: subtitle
      icon: mdi:bullhorn
    - type: entities
      entities:
      - entity: input_text.ansage_text_unterstand
        name: Text
      grid_options:
        columns: 9
    - type: button
      name: Senden
      icon: mdi:send
      show_state: false
      tap_action:
        action: perform-action
        perform_action: script.tts_kamera_textansage
        data:
          kamera: unterstand
      grid_options:
        columns: 3
        rows: 1
