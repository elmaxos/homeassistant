- id: '1788195823490'
  alias: Tesla Fast-Polling bei Annäherung
  description: 'Schnelleres Polling bei aktiver Navigation: Ziel 15-30 min entfernt jede Minute, unter 15 min und
    3 min nach Ankunft alle 30 s.'
  triggers:
  - trigger: time_pattern
    seconds: /30
    id: takt
  conditions:
  - condition: template
    value_template: >-
      {% set quelle = trigger.id | default('manuell') %}
      {% if quelle == 'manuell' %}true{% else %}
      {% set s = states.sensor.fky_zeit_bis_zur_ankunft %}
      {% if s is none %}false
      {% elif s.state in ['unknown', 'unavailable', 'none', ''] %}{{ (now() - s.last_changed).total_seconds() < 180 }}
      {% else %}{% set m = (as_timestamp(s.state) - now().timestamp()) / 60 %}
      {% if m <= 15 %}true{% elif m <= 30 %}{{ now().second < 15 }}{% else %}false{% endif %}
      {% endif %}{% endif %}
  actions:
  - action: homeassistant.update_entity
    target:
      entity_id:
      - device_tracker.fky_standort
      - sensor.fky_zeit_bis_zur_ankunft
  mode: single
  max_exceeded: silent
